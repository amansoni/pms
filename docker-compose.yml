services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: mental_health_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: securepass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mental-health-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mental_health_db
      KC_DB_USERNAME: dbuser
      KC_DB_PASSWORD: securepass123
      KC_HOSTNAME: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    networks:
      - mental-health-network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: backend
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: mental-health-realm
      DATABASE_URL: postgresql+psycopg2://dbuser:securepass123@postgres:5432/mental_health_db
    depends_on:
      - keycloak
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    networks:
      - mental-health-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - mental-health-network

volumes:
  postgres_data:

networks:
  mental-health-network:
    driver: bridge
